name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: BotGubakha.csproj

      - name: Restore
        run: dotnet restore BotGubakha.sln --locked-mode

      - name: Build
        run: dotnet build BotGubakha.sln --configuration Release --no-restore

      - name: Test
        env:
          TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
        run: dotnet run --project BotGubakha.Tests/BotGubakha.Tests.csproj --configuration Release --no-build --no-restore

      - name: Check formatting
        run: dotnet format BotGubakha.sln --no-restore --verify-no-changes

      - name: Audit NuGet packages
        run: dotnet list BotGubakha.sln package --vulnerable --include-transitive
